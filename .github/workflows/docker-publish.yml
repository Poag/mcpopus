name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Image names must be lowercase; this is fixed rather than derived from github.repository.
  IMAGE: ghcr.io/poag/mcpopus

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install in a clean virtualenv
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --no-deps -r requirements.lock
          .venv/bin/pip install --no-deps .
          .venv/bin/pip install pytest==9.2.0 pytest-asyncio==1.4.1.post1
      - name: Smoke (imports every module and dependency)
        run: .venv/bin/mcpopus smoke
      - name: Tests
        run: .venv/bin/python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (loaded locally for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mcpopus:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test the image
        run: |
          docker run --rm mcpopus:smoke smoke
          KEY=$(docker run --rm mcpopus:smoke genkey)
          docker run -d --name mcpopus-smoke -p 18080:8080 \
            -e MCPOPUS_PUBLIC_URL=https://mcp.example.com -e MCPOPUS_SECRET_KEY="$KEY" \
            -v "$PWD/plugins/hello:/plugins/hello:ro" mcpopus:smoke
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/hello -H 'Host: mcp.example.com')" = 401
          curl -fsS http://127.0.0.1:18080/.well-known/oauth-authorization-server -H 'Host: mcp.example.com' | grep -q '"S256"'
          docker logs mcpopus-smoke
          docker rm -f mcpopus-smoke
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest (main and version tags only)
        id: push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Export digest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest is published only from main, and not for version tags.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
