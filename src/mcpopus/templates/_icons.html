{% macro icon(name, size=16) -%}

{%- if name == "octopus" %}<path d="M5 12a7 7 0 0 1 14 0v2c0 1.5-.8 2-2 2s-1.2 3-3 3-1.2-3-2-3-1 3-2.5 3S8.8 16 7 16s-2-.5-2-2z"/><circle cx="9.5" cy="11" r="1"/><circle cx="14.5" cy="11" r="1"/>
{%- elif name == "home" %}<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>
{%- elif name == "plugins" %}<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>
{%- elif name == "access" %}<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>
{%- elif name == "audit" %}<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>
{%- elif name == "signin" %}<path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "logout" %}<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>
{%- elif name == "reload" %}<path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/>
{%- elif name == "play" %}<path d="M8 5v14l11-7z" fill="currentColor"/>
{%- elif name == "stop" %}<rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/>
{%- elif name == "power" %}<path d="M12 3v8M6.5 6.8a8 8 0 1 0 11 0"/>
{%- elif name == "settings" %}<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
{%- elif name == "git" %}<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 8v8M18 11c0 4-6 3-12 5"/>
{%- elif name == "download" %}<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>
{%- elif name == "trash" %}<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>
{%- elif name == "check" %}<path d="M5 12l5 5 9-10"/>
{%- elif name == "alert" %}<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>
{%- endif %}</svg>
{%- endmacro %}
